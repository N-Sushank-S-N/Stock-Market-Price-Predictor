name: CI
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # TensorFlow is optional (LSTM); CI skips it so the pipeline stays fast.
      - run: pip install -r requirements-ci.txt
      - run: pytest -q
